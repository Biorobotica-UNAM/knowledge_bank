# START
start_hri:
  - "Hello, I am {robot.name}. I will welcome the guests."
  - "Hi, I am {robot.name}. I will guide the guests."
  - "Greetings, I am {robot.name}. I will receive the guests."

# NAVIGATION
going_to_entrance:
  - "Navigating to the entrance."
  - "Heading to the entrance."
  - "Proceeding to the entrance."

reached_entrance:
  - "I arrived at the entrance."
  - "The entrance has been reached."
  - "I am now at the entrance."

going_to_living_room:
  - "Navigating to the living room."
  - "Heading to the living room."
  - "Proceeding to the living room."

reached_living_room:
  - "I arrived at the living room."
  - "The living room has been reached."
  - "I am now in the living room."

# REQUESTS
request_open_door:
  - "Please open the door."
  - "Please open the door so I may continue."
  - "Kindly open the door for me."

request_hand_gift:
  - "Please hand me the gift."
  - "Could you give me the gift, please?"
  - "Please pass me the gift."

# INSTRUCTIONS
instruct_follow_robot:
  - "Please follow me."
  - "Come with me and I will guide you."
  - "Right this way, please."

instruct_follow_person:
  - "Say CONTINUE and I will follow you. Say STOP and I will leave the gift."
  - "I am ready to follow you. Say CONTINUE to begin. Say STOP where you want me to leave the gift."
  - "When you are ready, say CONTINUE and I will follow you. Say STOP and I will leave the gift."

instruct_take_a_seat:
  - "Please take a seat here."
  - "You may sit here."
  - "This seat is available for you."

# INQUIRY
ask_name:
  - "What is your name?"
  - "May I know your name?"
  - "Could you tell me your name, please?"

ask_drink:
  - "What is your favorite drink?"
  - "Which drink do you prefer?"
  - "What drink do you like the most?"

# SEARCH
search_guest_1:
  - "Let me look for the first guest."
  - "I will search for the first guest."
  - "I am looking for the first guest now."

search_guest_2:
  - "Let me look for the second guest."
  - "I will search for the second guest."
  - "I am looking for the second guest now."

search_host:
  - "Let me look for the host."
  - "I am searching for the host now."
  - "I will find the host."

search_empty_seat:
  - "Let me find an empty seat."
  - "I will search for an available seat."
  - "I am looking for a seat now."

# INFORM
inform_present:
  - "Your guest brought this present for you."
  - "This present is from your guest."
  - "Your guest asked me to give you this present."

# ACKNOWLEDGE
acknowledge_name_1:
  - "Nice to meet you, {guest.1.name}."
  - "Hello, {guest.1.name}. Nice to meet you."
  - "It is great to meet you, {guest.1.name}."

acknowledge_name_2:
  - "Nice to meet you, {guest.2.name}."
  - "Hello, {guest.2.name}. Nice to meet you."
  - "It is great to meet you, {guest.2.name}."

acknowledge_drink_1:
  - "{guest.1.drink} is a great choice."
  - "I will remember that you like {guest.1.drink}."
  - "Thank you. I noted that you like {guest.1.drink}."

acknowledge_drink_2:
  - "{guest.2.drink} is a great choice."
  - "I will remember that you like {guest.2.drink}."
  - "Thank you. I noted that you like {guest.2.drink}."

# INTRODUCTION
introduce_guest_1:
  - "{guest.1.name}, please meet {guest.2.name}. {guest.2.name} likes {guest.2.drink}."
  - "{guest.1.name}, this is {guest.2.name}. {guest.2.name} likes {guest.2.drink}."
  - "{guest.1.name}, I would like you to meet {guest.2.name}. {guest.2.name} enjoys {guest.2.drink}."

introduce_guest_2:
  - "{guest.2.name}, please meet {guest.1.name}. {guest.1.name} likes {guest.1.drink}."
  - "{guest.2.name}, this is {guest.1.name}. {guest.1.name} likes {guest.1.drink}."
  - "{guest.2.name}, I would like you to meet {guest.1.name}. {guest.1.name} enjoys {guest.1.drink}."

# DESCRIPTION
describe_guest_1:
  - "{guest.1.name} is a {guest.1.description}."
  - "{guest.1.name} looks like a {guest.1.description}."
  - "{guest.1.name} appears as a {guest.1.description}."

describe_guest_2:
  - "{guest.2.name} is a {guest.2.description}."
  - "{guest.2.name} looks like a {guest.2.description}."
  - "{guest.2.name} appears as a {guest.2.description}."

# FINISH
finish_hri:
  - "Thank you, and have a great time."
  - "It was a pleasure assisting you today."
  - "I hope you enjoy the event."
