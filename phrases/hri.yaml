# START
start_hri:
  - "Hello, I am {robot_name}. I will welcome the guests."
  - "Hi, I am {robot_name}. I will guide the guests."
  - "Greetings, I am {robot_name}. I will receive the guests."

# NAVIGATION
going_to_entrance:
  - "Navigating to the entrance."
  - "Heading to the entrance."
  - "Proceeding to the entrance."

reached_entrance:
  - "I arrived at the entrance."
  - "The entrance has been reached."
  - "I am now at the entrance."

going_to_living_room:
  - "Navigating to the living room."
  - "Heading to the living room."
  - "Proceeding to the living room."

reached_living_room:
  - "I arrived at the living room."
  - "The living room has been reached."
  - "I am now in the living room."

# REQUESTS
request_open_door:
  - "Please open the door."
  - "Please open the door so I may continue."
  - "Kindly open the door for me."

request_hand_gift:
  - "Please hand me the gift."
  - "Could you give me the gift, please?"
  - "Please pass me the gift."

# INSTRUCTIONS
instruct_follow_robot:
  - "Please follow me."
  - "Come with me and I will guide you."
  - "Right this way, please."

instruct_follow_person:
  - "Please stand in front of me and say CONTINUE to start following you"
  - "Stand in front of me. Say CONTINUE to begin."
  - "When you are in front of me, say CONTINUE and I will follow you."

instruct_follow_only:
  - "Say CONTINUE and I will start following you. Say STOP when you want me to stop."
  - "I am ready to follow you. Say CONTINUE to begin, and STOP when I should stop."
  - "When you are ready, say CONTINUE and I will follow you until you say STOP."

instruct_take_a_seat:
  - "Please take a seat here."
  - "You may sit here."
  - "This seat is available for you."

instruct_command_continue:
  - "Please say, continue, to proceed."
  - "I am waiting for the word, continue."
  - "Kindly say, continue, to start test."

instruct_look_at:
  - "Please look at me."
  - "Please look at my camera."
  - "Please keep looking at me."

# INQUIRY
ask_name:
  - "What is your name?"
  - "May I know your name?"
  - "Could you tell me your name, please?"

ask_drink:
  - "What is your favorite drink?"
  - "Which drink do you prefer?"
  - "What drink do you like the most?"

# SEARCH
search_guest_1:
  - "Let me look for the first guest."
  - "I will search for the first guest."
  - "I am looking for the first guest now."

search_guest_2:
  - "Let me look for the second guest."
  - "I will search for the second guest."
  - "I am looking for the second guest now."

search_host:
  - "Let me look for the host."
  - "I am searching for the host now."
  - "I will find the host."

search_empty_seat:
  - "Let me find an empty seat."
  - "I will search for an available seat."
  - "I am looking for a seat now."

# INFORM
inform_present:
  - "Your guest brought this present for you."
  - "This present is from your guest."
  - "Your guest asked me to give you this present."

# ACKNOWLEDGE
acknowledge_name_1:
  - "Nice to meet you, {guest_name_1}."
  - "Hello, {guest_name_1}. Nice to meet you."
  - "It is great to meet you, {guest_name_1}."

acknowledge_name_2:
  - "Nice to meet you, {guest_name_2}."
  - "Hello, {guest_name_2}. Nice to meet you."
  - "It is great to meet you, {guest_name_2}."

acknowledge_drink_1:
  - "{guest_drink_1} is a great choice."
  - "I will remember that you like {guest_drink_1}."
  - "Thank you. I noted that you like {guest_drink_1}."

acknowledge_drink_2:
  - "{guest_drink_2} is a great choice."
  - "I will remember that you like {guest_drink_2}."
  - "Thank you. I noted that you like {guest_drink_2}."

# INTRODUCTION
introduce_guest_1:
  - "{guest_name_2}, please meet {guest_name_1}. {guest_name_1} likes {guest_drink_1}."
  - "{guest_name_2}, this is {guest_name_1}. {guest_name_1} likes {guest_drink_1}."
  - "{guest_name_2}, I would like you to meet {guest_name_1}. {guest_name_1} enjoys {guest_drink_1}."

introduce_guest_2:
  - "{guest_name_1}, please meet {guest_name_2}. {guest_name_2} likes {guest_drink_2}."
  - "{guest_name_1}, this is {guest_name_2}. {guest_name_2} likes {guest_drink_2}."
  - "{guest_name_1}, I would like you to meet {guest_name_2}. {guest_name_2} enjoys {guest_drink_2}."

# DESCRIPTION
describe_guest_1:
  - "{guest_name_1} is a {guest_description_1}."
  - "{guest_name_1} looks like a {guest_description_1}."
  - "{guest_name_1} appears as a {guest_description_1}."

describe_guest_2:
  - "{guest_name_2} is a {guest_description_2}."
  - "{guest_name_2} looks like a {guest_description_2}."
  - "{guest_name_2} appears as a {guest_description_2}."

# FINISH
finish_hri:
  - "Thank you, and have a great time."
  - "It was a pleasure assisting you today."
  - "I hope you enjoy the event."
