# START
start_hri:
  - "Hello, I am {robot_name}, your receptionist. I will welcome our guests and guide them."
  - "Hi, I am {robot_name}. I will greet the guests and show them where to sit."
  - "Greetings, I am {robot_name}. I will receive the guests and offer them a seat."

# NAVIGATION
going_to:
  - "I am heading to the {location} now."
  - "Navigating to the {location}."
  - "Proceeding to the {location}."
  - "On my way to the {location}."
  - "I will move toward the {location}."

arrived_at:
  - "I have arrived at the {location}."
  - "I am now at the {location}."
  - "Navigation to the {location} is complete."
  - "{location} reached."
  - "I am ready at the {location}."

# REQUESTS
request_open_door:
  - "Please open the door so I can proceed."
  - "I am waiting for the door to be opened."
  - "Kindly open the door so I may pass."

ask_bag:
  - "Excuse me, could you please hand me the bag?"
  - "May I take the bag, please?"
  - "Would you be so kind as to give me the bag?"
  - "Please hand me the bag, I will take care of it."

# INSTRUCTIONS
instruct_follow:
  - "Please follow me, I will find you a nice seat."
  - "Come with me, I will find a comfortable spot for you."
  - "Right this way, I will look for a nice seat for you."

user_follow:
  - "Whenever you are ready, please let me know and I will follow you."
  - "When you are ready, please lead the way and I will follow you."

memorize_face:
  - "Please look at me so I can remember your face."
  - "Kindly look at me so I can remember you."
  - "Could you look at me for a moment so I can recognize you later?"

instruct_close gripper:
  - "I will close my hand"


# INQUIRY
ask_name:
  - "Excuse me, what is your name?"
  - "May I know your name, please?"
  - "Could you please tell me your name?"
  - "Would you mind telling me your name?"

ask_drink:
  - "What is your favorite drink?"
  - "Could you please tell me your preferred drink?"
  - "May I know your favorite beverage?"
  - "Which drink do you like best?"

# CONFIRMATION
confirm_name:
  - "You are {name}. Is that correct?"
  - "Just to confirm, you are {name}. Right?"
  - "Is {name} your name?"

confirm_drink:
  - "You like {drink}. Is that correct?"
  - "Just to confirm, you enjoy {drink}. Right?"
  - "Is {drink} your prefered drink?"

# INTERACTION
find_guest:
  - "Let me see if our guest is here."
  - "I will check the door for our guest."
  - "I am going to look for the invited guest."

find_person:
  - "Let me see where you are, {name}."
  - "{name}, let me look around for you."
  - "Alright {name}, let me spot you first."
  - "I am looking for you now, {name}."

react_name:
  - "Nice to meet you, {name}."
  - "Hi {name}, nice to meet you."
  - "It's a pleasure to meet you, {name}."
  - "Great to meet you, {name}."

react_drink:
  - "Ooh, {drink}, great choice."
  - "Wonderful, {drink} it is."
  - "{drink}, coming right up."
  - "That is a lovely choice, {drink}."

find_empty_seat:
  - "Alright, let me find you a nice seat."
  - "I will find a comfortable spot for you now."
  - "Let me see where you can sit."

offer_seat:
  - "Please have a seat here."
  - "You may sit here, please."
  - "This seat is for you."
  - "Kindly take a seat here."

receive_present:
  - "Your guest brought this for you."
  - "This is a gift from your guest."
  - "Your guest asked me to give you this."

# INTRODUCTION
introduce_guest_1:
  - "{name_a}, meet {name_b}. {name_b} likes {drink_b}."
  - "{name_a}, this is {name_b}. {name_b}'s favorite drink is {drink_b}."
  - "{name_a}, please meet {name_b}. {name_b} enjoys {drink_b}."

# DESCRIPTION
describe_guest_1:
  - "There is already another guest in the living room, a {guest_age} {guest_gender} with {guest_hair} and a {guest_shirt_color} shirt."
  - "Another guest is already waiting inside, a {guest_gender} with {guest_hair} who seems {guest_emotion}."
  - "You will meet another guest, a {guest_age} {guest_gender} wearing a {guest_shirt_color} shirt and {guest_accessories}."
  - "Someone is already waiting, a {guest_emotion} {guest_age} {guest_gender} in a {guest_shirt_color} shirt."
  - "A guest is already in the living room, a {guest_age} {guest_gender} with {guest_hair} and {guest_accessories}."

describe_guest_1:
  - "There is already another guest in the living room, a {guest_age} {guest_gender} with {guest_hair} and a {guest_shirt_color} shirt."
  - "Another guest is already waiting inside, a {guest_gender} with {guest_hair} who seems {guest_emotion}."
  - "You will meet another guest, a {guest_age} {guest_gender} wearing a {guest_shirt_color} shirt and {guest_accessories}."
  - "Someone is already waiting, a {guest_emotion} {guest_age} {guest_gender} in a {guest_shirt_color} shirt."
  - "A guest is already in the living room, a {guest_age} {guest_gender} with {guest_hair} and {guest_accessories}."

# FINISH
finish_hri:
  - "It was a pleasure to be your receptionist. I am {robot_name} and I hope you had a great time."
  - "I'm glad I could assist you today. This is {robot_name} signing off."
  - "Assisting you has been a delight. Have a great time!"
