# START
start_hri:
  - "Hello, I am {robot.name}. I will welcome the guests."
  - "Hi, I am {robot.name}. I will guide the guests."
  - "Greetings, I am {robot.name}. I will receive the guests."

# NAVIGATION
going_to_entrance:
  - "Navigating to the entrance."
  - "Heading to the entrance."
  - "Proceeding to the entrance."

reached_entrance:
  - "I arrived at the entrance."
  - "The entrance has been reached."
  - "I am now at the entrance."

going_to_living_room:
  - "Navigating to the living room."
  - "Heading to the living room."
  - "Proceeding to the living room."

reached_living_room:
  - "I arrived at the living room."
  - "The living room has been reached."
  - "I am now in the living room."

# REQUESTS
request_open_door:
  - "Please open the door."
  - "Please open the door so I may continue."
  - "Kindly open the door for me."

request_hand_gift:
  - "Please hand me the gift."
  - "Could you give me the gift, please?"
  - "Please pass me the gift."

# INSTRUCTIONS
instruct_follow_robot:
  - "Please follow me."
  - "Come with me and I will guide you."
  - "Right this way, please."

instruct_follow_person:
  - "Please lead the way."
  - "I am ready to follow you."
  - "Show me the way and I will follow."

instruct_look_at_robot:
  - "Please look at me."
  - "Look at me for a moment, please."
  - "Kindly face me so I can remember you."

instruct_take_a_seat:
  - "Please take a seat here."
  - "You may sit here."
  - "This seat is available for you."

# INQUIRY
ask_name:
  - "What is your name?"
  - "May I know your name?"
  - "Could you tell me your name, please?"

ask_drink:
  - "What is your favorite drink?"
  - "Which drink do you prefer?"
  - "What drink do you like the most?"

# CONFIRMATION
confirm_name_1:
  - "You are {people.1.name}, correct?"
  - "Did you say your name is {people.1.name}?"
  - "Is your name {people.1.name}?"

confirm_name_2:
  - "You are {people.2.name}, correct?"
  - "Did you say your name is {people.2.name}?"
  - "Is your name {people.2.name}?"

confirm_drink_1:
  - "You like {people.1.drink}, correct?"
  - "Did you say you like {people.1.drink}?"
  - "Is {people.1.drink} your favorite drink?"

confirm_drink_2:
  - "You like {people.2.drink}, correct?"
  - "Did you say you like {people.2.drink}?"
  - "Is {people.2.drink} your favorite drink?"

# SEARCH
search_guest:
  - "Let me look for the guest."
  - "I will search for the guest."
  - "I am looking for the guest now."

search_person:
  - "Let me look for you, {host}."
  - "I am searching for you, {host}."
  - "{host}, I am looking for you now."

search_empty_seat:
  - "Let me find an empty seat."
  - "I will search for an available seat."
  - "I am looking for a seat now."

# INFORM
inform_guest_found:
  - "I found {guest}."
  - "{guest} is here."
  - "I can see {guest} now."

inform_person_found:
  - "I found {host}."
  - "{host} is here."
  - "I can see {host} now."

inform_seat_found:
  - "I found an empty {seat}."
  - "There is an available {seat} here."
  - "I found a seat for you here."

inform_present:
  - "Your guest brought this gift for you."
  - "This gift is from your guest."
  - "Your guest asked me to give you this gift."

# ACKNOWLEDGE
acknowledge_name_1:
  - "Nice to meet you, {people.1.name}."
  - "Hello, {people.1.name}. Nice to meet you."
  - "It is great to meet you, {people.1.name}."

acknowledge_name_2:
  - "Nice to meet you, {people.2.name}."
  - "Hello, {people.2.name}. Nice to meet you."
  - "It is great to meet you, {people.2.name}."

acknowledge_drink_1:
  - "{people.1.drink} is a great choice."
  - "I will remember that you like {people.1.drink}."
  - "Thank you. I noted that you like {people.1.drink}."

acknowledge_drink_2:
  - "{drink} is a great choice."
  - "I will remember that you like {drink}."
  - "Thank you. I noted that you like {drink}."

# INTRODUCTION
introduce_first_guest:
  - "{first_guest}, please meet {second_guest}. {second_guest} likes {second_guest_drink}."
  - "{first_guest}, this is {second_guest}. {second_guest} likes {second_guest_drink}."
  - "{first_guest}, I would like you to meet {second_guest}. {second_guest} enjoys {second_guest_drink}."

introduce_second_guest:
  - "{second_guest}, please meet {first_guest}. {first_guest} likes {first_guest_drink}."
  - "{second_guest}, this is {first_guest}. {first_guest} likes {first_guest_drink}."
  - "{second_guest}, I would like you to meet {first_guest}. {first_guest} enjoys {first_guest_drink}."

# DESCRIPTION
describe_first_guest:
  - "{second_guest}, this is {first_guest}, a {first_guest_age} {first_guest_gender} with {first_guest_hair} and a {first_guest_shirt_color} shirt."
  - "{second_guest}, {first_guest} is a {first_guest_gender} with {first_guest_hair} wearing a {first_guest_shirt_color} shirt."
  - "{second_guest}, you will meet {first_guest}, a {first_guest_age} {first_guest_gender} wearing {first_guest_accessories}."

describe_second_guest:
  - "{first_guest}, this is {second_guest}, a {second_guest_age} {second_guest_gender} with {second_guest_hair} and a {second_guest_shirt_color} shirt."
  - "{first_guest}, {second_guest} is a {second_guest_gender} with {second_guest_hair} wearing a {second_guest_shirt_color} shirt."
  - "{first_guest}, you will meet {second_guest}, a {second_guest_age} {second_guest_gender} wearing {second_guest_accessories}."

# FINISH
finish_hri:
  - "Thank you, and have a great time."
  - "It was a pleasure assisting you today."
  - "I hope you enjoy the event."
