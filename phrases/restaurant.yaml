ask_order: 
  - "Please tell me your order." 
  - "What would you like to order?" 
  - "I am listening to your order." 
  - "Which items would you like?" 
  
ask_repeat: 
  - "Could you please repeat that?" 
  - "I did not understand. Please say it again." 
  - "Sorry, can you repeat your order?" 
  - "Please speak a little louder." 
  
ask_one_by_one: 
  - "Please say the items one by one." 
  - "Could you repeat the order slowly?" 
  - "Please mention one object at a time." 
  
not_understood: 
  - "I could not understand the order." 
  - "I am sorry, I did not catch that." 
  - "The order was unclear to me." 

