# START
start_hri:
  - "Hello, I am {robot.name}. I will welcome the guests."
  - "Hi, I am {robot.name}. I will guide the guests."
  - "Greetings, I am {robot.name}. I will receive the guests."

# NAVIGATION
going_to_entrance:
  - "Navigating to the entrance."
  - "Heading to the entrance."
  - "Proceeding to the entrance."

reached_entrance:
  - "I arrived at the entrance."
  - "The entrance has been reached."
  - "I am now at the entrance."

going_to_living_room:
  - "Navigating to the living room."
  - "Heading to the living room."
  - "Proceeding to the living room."

reached_living_room:
  - "I arrived at the living room."
  - "The living room has been reached."
  - "I am now in the living room."

# REQUESTS
request_open_door:
  - "Please open the door."
  - "Please open the door so I may continue."
  - "Kindly open the door for me."

request_hand_gift:
  - "Please hand me the gift."
  - "Could you give me the gift, please?"
  - "Please pass me the gift."

# INSTRUCTIONS
instruct_follow_robot:
  - "Please follow me."
  - "Come with me and I will guide you."
  - "Right this way, please."

instruct_follow_person:
  - "Please lead the way."
  - "I am ready to follow you."
  - "Show me the way and I will follow."

instruct_look_at_robot:
  - "Please look at me."
  - "Look at me for a moment, please."
  - "Kindly face me so I can remember you."

instruct_take_a_seat:
  - "Please take a seat here."
  - "You may sit here."
  - "This seat is available for you."

# INQUIRY
ask_name:
  - "What is your name?"
  - "May I know your name?"
  - "Could you tell me your name, please?"

ask_drink:
  - "What is your favorite drink?"
  - "Which drink do you prefer?"
  - "What drink do you like the most?"

# CONFIRMATION
confirm_name_1:
  - "You are {people.1.name}, correct?"
  - "Did you say your name is {people.1.name}?"
  - "Is your name {people.1.name}?"

confirm_name_2:
  - "You are {people.2.name}, correct?"
  - "Did you say your name is {people.2.name}?"
  - "Is your name {people.2.name}?"

confirm_drink_1:
  - "You like {people.1.drink}, correct?"
  - "Did you say you like {people.1.drink}?"
  - "Is {people.1.drink} your favorite drink?"

confirm_drink_2:
  - "You like {people.2.drink}, correct?"
  - "Did you say you like {people.2.drink}?"
  - "Is {people.2.drink} your favorite drink?"

# SEARCH
search_guest:
  - "Let me look for the guest."
  - "I will search for the guest."
  - "I am looking for the guest now."

search_person:
  - "Let me look for you, {host.name}."
  - "I am searching for you, {host.name}."
  - "{host.name}, I am looking for you now."

search_empty_seat:
  - "Let me find an empty seat."
  - "I will search for an available seat."
  - "I am looking for a seat now."

# INFORM
inform_guest_found:
  - "I found a guest."
  - "Our guest is here."
  - "I can see a guest now."

inform_person_found:
  - "I found {host.name}."
  - "{host.name} is here."
  - "I can see {host.name} now."

inform_seat_found:
  - "I found an empty seat."
  - "There is an available seat here."
  - "I found a seat for you here."

inform_present:
  - "Your guest brought this gift for you."
  - "This gift is from your guest."
  - "Your guest asked me to give you this gift."

# ACKNOWLEDGE
acknowledge_name_1:
  - "Nice to meet you, {people.1.name}."
  - "Hello, {people.1.name}. Nice to meet you."
  - "It is great to meet you, {people.1.name}."

acknowledge_name_2:
  - "Nice to meet you, {people.2.name}."
  - "Hello, {people.2.name}. Nice to meet you."
  - "It is great to meet you, {people.2.name}."

acknowledge_drink_1:
  - "{people.1.drink} is a great choice."
  - "I will remember that you like {people.1.drink}."
  - "Thank you. I noted that you like {people.1.drink}."

acknowledge_drink_2:
  - "{people.2.drink} is a great choice."
  - "I will remember that you like {people.2.drink}."
  - "Thank you. I noted that you like {people.2.drink}."

# INTRODUCTION
introduce_guest_1:
  - "{people.1.name}, please meet {people.2.name}. {people.2.name} likes {people.2.drink}."
  - "{people.1.name}, this is {people.2.name}. {people.2.name} likes {people.2.drink}."
  - "{people.1.name}, I would like you to meet {people.2.name}. {people.2.name} enjoys {people.2.drink}."

introduce_guest_2:
  - "{people.2.name}, please meet {people.1.name}. {people.1.name} likes {people.1.drink}."
  - "{people.2.name}, this is {people.1.name}. {people.1.name} likes {people.1.drink}."
  - "{people.2.name}, I would like you to meet {people.1.name}. {people.1.name} enjoys {people.1.drink}."

# DESCRIPTION
describe_guest_1:
  - "{people.2.name}, this is {people.1.name}, a {people.1.age_group} {people.1.gender} with {people.1.hair_color} {people.1.hair_style}, wearing a {people.1.shirt_color} shirt and {people.1.accessories}."
  - "{people.2.name}, {people.1.name} is a {people.1.emotion} {people.1.gender} wearing a {people.1.shirt_color} shirt and {people.1.accessories}."
  - "{people.2.name}, you will meet {people.1.name}, a {people.1.age_group} {people.1.gender} with {people.1.hair_color} hair and {people.1.accessories}."

describe_guest_2:
  - "{people.1.name}, this is {people.2.name}, a {people.2.age_group} {people.2.gender} with {people.2.hair_color} {people.2.hair_style}, wearing a {people.2.shirt_color} shirt and {people.2.accessories}."
  - "{people.1.name}, {people.2.name} is a {people.2.emotion} {people.2.gender} wearing a {people.2.shirt_color} shirt and {people.2.accessories}."
  - "{people.1.name}, you will meet {people.2.name}, a {people.2.age_group} {people.2.gender} with {people.2.hair_color} hair and {people.2.accessories}."

# FINISH
finish_hri:
  - "Thank you, and have a great time."
  - "It was a pleasure assisting you today."
  - "I hope you enjoy the event."
