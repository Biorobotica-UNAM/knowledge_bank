# CUSTOMER INTERACTION

introduce_waitress:
  - "Hello, my name is {robot_name}. What can I get for you?"
  - "Hi, I am {robot_name}. Can I take your order, please?"
  - "Hello, I am {robot_name}. I am here to take your order."
  - "Hi, my name is {robot_name}. I will help you with your order."
  - "Hi, I am {robot_name}. What would you like to order?"
  - "Hello, my name is {robot_name}. May I take your order?"
  - "Hello, I am {robot_name}. Please tell me your order."
  - "Hi, I am {robot_name}. Please tell me what you would like to order."
  - "Hello, I am {robot_name}. May I help you with your order?"
  - "Hello, I am {robot_name}. Please let me know your order."
  - "Hi, my name is {robot_name}. What can I bring you?"

