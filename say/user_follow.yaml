phrases:
  - "Whenever you are ready, please let me know and I will follow you."
  - "I am ready whenever you are. Please tell me when we can go."
  - "When you are ready, please lead the way and I will follow you."
  - "Please let me know when you would like to begin, and I will follow you."
  - "As soon as you are ready, please let me know and I will go with you."