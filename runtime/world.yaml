# ===============================================================================
# PLANTILLA DE ESTADO INICIAL DEL MUNDO
# ===============================================================================

robot:
  # Propiedades del Robot:
  # - name (String): Nombre identificador del robot.
  # - known_location (String): Ubicación de referencia actual en el mapa.
  # - hands (Diccionario): Representa qué objeto sostiene cada brazo.
  #   - Claves válidas: LEFT, RIGHT.
  #   - Valores: Nombre del objeto (String) o null si la mano está libre.
  name: "service_bot_1"
  known_location: "kitchen"
  hands:
    LEFT: null
    RIGHT: "apple_1"

objects:
  # Propiedades de ManipulableObject:
  # Nota: El InitialStateLoader inicializa los objetos sin pose, ya que la pose navegable o de agarre será calculada posteriormente por el sistema de visión.
  # - name (String): Nombre identificador del objeto.
  # - category (String): Categoría del objeto.
  #   - Valores válidos: FRUIT, CUTLERY, DISH, TRASH.
  # - ownership (Diccionario): Representa las formas mutuamente excluyentes en las que se sostiene el objeto.
  #   Debe contener EXACTAMENTE UNA de las siguientes llaves:
  #   - at_location: Nombre de la ubicación donde descansa (String).
  #   - held_by_person: Nombre de la persona que lo sostiene (String).
  #   - held_by_robot: Mano del robot que lo sostiene ("LEFT" o "RIGHT").
  - name: "apple_1"
    category: "FRUIT"
    ownership:
      held_by_robot: "RIGHT"
      
  - name: "fork_1"
    category: "CUTLERY"
    ownership:
      at_location: "kitchen"

persons:
  # Propiedades de Person:
  # - name (String): Nombre de la persona.
  # - person_type (String): Tipo fijo asignado a la persona.
  #   - Valores válidos: GUEST, CUSTOMER, HOST, USER.
  #   - Nota: Solo un Person puede tener el tipo USER a la vez.
  # - known_location (String): Lugar de referencia donde se encuentra la persona.
  # - favorite_drink (String, opcional): Válido únicamente si person_type es GUEST. Queda vacío en otros casos.
  # - order (Lista de Strings, opcional): Lista de objetos conocidos que componen la orden. Válido únicamente si person_type es CUSTOMER.
  # - physical_description (Diccionario): Descripción física estructurada.
  #   - gender (String): Género reportado por visión o por la persona.
  #   - clothes (String): Descripción de la ropa.
  #   - age (String): Edad o rango de edad.
  #   - hair_type (String): Descripción del cabello.
  #   - facial_expression (String): Expresión facial.
  #   - accessories (String): Accesorios visibles (ej. lentes, sombrero).
  - name: "Alice"
    person_type: "HOST"
    known_location: "kitchen"
    physical_description:
      gender: "female"
      clothes: "blue shirt"
      age: "adult"
      hair_type: "short"
      facial_expression: "smiling"
      accessories: "glasses"
      
  - name: "Bob"
    person_type: "GUEST"
    known_location: "living room"
    favorite_drink: "water"
    physical_description:
      gender: "male"
      clothes: "red sweater"
      age: "senior"
      hair_type: "bald"
      facial_expression: "neutral"
      accessories: "none"
