# START
start_restaurant:
  - "Hello, I am {robot_name}. I will serve the customers today."
  - "Hi, I am {robot_name}. I will take and deliver the orders."
  - "Greetings, I am {robot_name}. I will attend the customers."

# NAVIGATION
going_to_customer:
  - "Navigating to the customer."
  - "Heading to the customer."
  - "Proceeding to the customer."

reached_customer:
  - "I arrived at the customer."
  - "The customer has been reached."
  - "I am now with the customer."

going_to_kitchen_bar:
  - "Navigating to the kitchen bar."
  - "Heading to the kitchen bar."
  - "Proceeding to the kitchen bar."

reached_kitchen_bar:
  - "I arrived at the kitchen bar."
  - "The kitchen bar has been reached."
  - "I am now at the kitchen bar."

# SEARCH
search_customer_1:
  - "Let me look for the first customer."
  - "I will search for the first customer."
  - "I am looking for the first customer now."

search_customer_2:
  - "Let me look for the second customer."
  - "I will search for the second customer."
  - "I am looking for the second customer now."

# REQUESTS
request_place_order_on_tray:
  - "Please place the order on my tray. Say continue once you're finished."
  - "Could you put the order on my tray, please? Say continue once the items are placed."
  - "Please leave the order on my tray. Say continue when everything is set."

request_take_order_from_tray:
  - "Please take your order from my tray. Say continue when you're finished."
  - "You may pick up your order from my tray. Say continue once you're done."
  - "Your order is ready. Please take it from my tray and say continue when you're ready."

# INQUIRY
ask_order:
  - "What would you like to order?"
  - "May I take your order?"
  - "Could you tell me your order, please?"

# INFORM
inform_order_1:
  - "Hello, barman. The customer ordered {customer_order_1}."
  - "Good to see you, barman! I have an order for {customer_order_1}."
  - "Hey, barman! The requested order is {customer_order_1}."

inform_order_2:
  - "Good to see you, barman! The customer ordered {customer_order_2}."
  - "Hey, barman! I have an order for {customer_order_2}."
  - "Hello, barman. The requested order is {customer_order_2}."

# ACKNOWLEDGE
acknowledge_order_1:
  - "You ordered {customer_order_1}."
  - "Thank you. I noted your order: {customer_order_1}."
  - "I have recorded your order: {customer_order_1}."

acknowledge_order_2:
  - "You ordered {customer_order_2}."
  - "Thank you. I noted your order: {customer_order_2}."
  - "I have recorded your order: {customer_order_2}."

# FINISH
finish_restaurant:
  - "I have finished the waiter task."
  - "All orders have been completed."
  - "The customers have been served successfully."

